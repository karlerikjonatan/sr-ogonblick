<!doctype html>
<!--
THESIS: Compare complete page captures at a shared height instead of cropping them into thumbnails.
OWN-WORLD: Inherit the archive's system type, restrained teal links, neutral surfaces, and light/dark colors.
STORY: Choose desktop or mobile, scan captures newest first, and open any original image.
FIRST VIEWPORT: Page title and return link above layout controls, capture metadata, then a horizontally scrollable image row.
FORM: A focused comparison viewer within the existing static archive; the archive and history page remain unchanged.
-->
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Jämför helsidesskärmbilder från SR Ögonblicks arkiv.">
  <title>Jämför skärmbilder | SR Ögonblick</title>
  <link rel="stylesheet" href="styles.css">
  <script src="compare.js" defer></script>
</head>
<body class="comparison-page">
  <header class="masthead">
    <a class="history-nav" href="index.html">← Tillbaka till arkivet</a>
    <h1 id="comparison-title">Jämför skärmbilder</h1>
    <p class="history-intro">Helsidesskärmbilder, nyaste först. Välj visningsläge och bläddra sedan i sidled.</p>
  </header>
  <main class="comparison-main">
    <fieldset class="layout-picker comparison-layout-picker">
      <legend class="visually-hidden">Visningsläge</legend>
      <input id="comparison-desktop" type="radio" name="comparison-layout" value="desktop" checked>
      <label for="comparison-desktop">Dator</label>
      <input id="comparison-mobile" type="radio" name="comparison-layout" value="mobile">
      <label for="comparison-mobile">Mobil</label>
    </fieldset>
    <p id="comparison-status" class="history-status" role="status">Laddar skärmbilder…</p>
    <ul class="comparison-roll" id="comparison-roll" role="list" aria-label="Skärmbilder på dator" tabindex="0" hidden></ul>
  </main>
  <footer>Välj en bild för att öppna originalet. Alla tider anges i svensk tid.</footer>
</body>
</html>
