<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse all archived captures of one Sveriges Radio page.">
  <title>Capture history | SR page snapshots</title>
  <link rel="stylesheet" href="styles.css">
  <script src="history.js" defer></script>
</head>
<body>
  <header class="masthead">
    <a class="history-nav" href="index.html">← Back to archive</a>
    <h1 id="history-title">Capture history</h1>
    <p class="history-intro">Desktop and mobile captures, newest first. All times in UTC.</p>
  </header>
  <main>
    <p id="history-status" class="history-status" role="status"></p>
    <ul class="history-roll" id="history-roll" role="list" aria-label="Capture runs" tabindex="0" hidden></ul>
    <noscript><p>JavaScript is required to browse capture history. You can still browse all captures in the <a href="index.html">archive</a>.</p></noscript>
  </main>
</body>
</html>
