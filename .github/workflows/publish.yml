name: Publish existing gallery

on:
  workflow_dispatch:

concurrency:
  group: sr-ogonblick-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: docs
          retention-days: 30

  deploy:
    needs: upload
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy committed gallery
        id: deployment
        uses: actions/deploy-pages@v5.0.1
